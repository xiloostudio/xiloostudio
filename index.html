<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#D4BC8E">
    <title>Xiloo Studio</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <section class="tela">
            <div class="intro-content">
                <header style="border:none;">
                    <h1 style="font-size: 2.2rem;">XILOO <span class="highlight">STUDIO</span></h1>
                </header>
                <img src="image_0e1532.png" alt="Logo Xiló" class="logo-principal">
                <p class="tagline">O seu guia prático para o xilofone</p>
                <div class="apresentacao-texto">
                    <h2>Sobre o Projeto</h2>
                    <p>Bem-vindo ao Xiloo Studio! Este aplicativo é o companheiro ideal do seu xilofone físico. Siga a partitura na tela, ouça o ritmo e pratique batendo no seu próprio instrumento.</p>
                </div>
                <a href="biblioteca.html" class="btn btn-large" style="background:#2ECC71; color:white; text-decoration:none;">Entrar na Biblioteca</a>
            </div>
        </section>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
        }
    </script>
</body>
</html>
